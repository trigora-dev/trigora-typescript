name: release

on:
  push:
    tags: ["v1.0.0"]

jobs:
  package:
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trigora-typescript-1.0.0
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the SDK
        run: npm publish dist/trigora-sdk-*.tgz
      - name: Publish the client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish dist/trigora-client-*.tgz
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
