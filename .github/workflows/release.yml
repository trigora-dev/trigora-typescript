name: release

on:
  push:
    tags: ["v1.0.1"]

jobs:
  package:
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: trigora-typescript-1.0.1
          path: dist
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish the SDK
        run: |
          set -euo pipefail
          publish() {
            local pkg="$1"
            local output status
            # A path with a slash and no leading ./ is a GitHub repo spec to npm.
            test -f "$pkg"
            set +e
            output=$(npm publish "./$pkg" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if printf '%s\n' "$output" | grep -Eiq 'previously published|EPUBLISHCONFLICT'; then
              return 0
            fi
            return "$status"
          }
          publish dist/trigora-sdk-1.0.0.tgz
      - name: Publish the client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          set -euo pipefail
          publish() {
            local pkg="$1"
            local output status
            # A path with a slash and no leading ./ is a GitHub repo spec to npm.
            test -f "$pkg"
            set +e
            output=$(npm publish "./$pkg" --access public 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if printf '%s\n' "$output" | grep -Eiq 'previously published|EPUBLISHCONFLICT'; then
              return 0
            fi
            return "$status"
          }
          publish dist/trigora-client-1.0.1.tgz
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
