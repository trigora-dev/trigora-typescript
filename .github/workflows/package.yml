name: package

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: trigora-dev/trigora
          path: ../trigora
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - run: pnpm install
      - name: Pack contracts
        working-directory: ../trigora/packages/contracts
        run: |
          npm install
          npm run build
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - run: pnpm --filter @trigora/sdk build
      - run: pnpm --filter @trigora/sdk exec npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - run: pnpm --filter @trigora/client build
      - run: pnpm --filter @trigora/client exec npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - name: Install the tarballs
        run: |
          mkdir -p /tmp/trigora-ts
          npm install --prefix /tmp/trigora-ts "$GITHUB_WORKSPACE"/dist/trigora-contracts-0.9.0.tgz
          npm install --prefix /tmp/trigora-ts "$GITHUB_WORKSPACE"/dist/trigora-sdk-0.9.0.tgz
          npm install --prefix /tmp/trigora-ts "$GITHUB_WORKSPACE"/dist/trigora-client-0.9.0.tgz
          cd /tmp/trigora-ts
          node --input-type=module -e "import { effect } from '@trigora/sdk'; import { createClient } from '@trigora/client'; const client = createClient({ url: 'http://127.0.0.1:9' }); if (typeof effect !== 'function' || typeof client.start !== 'function') process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: trigora-typescript-0.9.0
          path: dist/*
